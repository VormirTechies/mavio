name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["22", "24"]

    env:
      MAVIO_BROWSER_CHANNEL: ""
      PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "120000"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser
        run: npx playwright install --with-deps chromium --only-shell

      - name: Verify SDK
        run: npm run check

  native:
    name: Native Ubuntu 24.04 / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install native tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Record native tool versions
        run: |
          /usr/bin/ffmpeg -version
          /usr/bin/ffprobe -version

      - name: Verify native media processing
        run: npm run check:native:all -- /usr/bin/ffmpeg /usr/bin/ffprobe

  browser:
    name: Browser ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
        node: ["22", "24"]

    env:
      MAVIO_BROWSER_CHANNEL: ""
      PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "120000"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium --only-shell

      - name: Verify implemented browser routes
        run: npm run check:browser:verified

  native-platforms:
    name: Native ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
        node: ["22", "24"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install native tools on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ffmpeg --yes --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw "FFmpeg installation failed with exit code $LASTEXITCODE"
          }

      - name: Install native tools on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: brew install ffmpeg

      - name: Verify native processing on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ffmpegPath = (Get-Command ffmpeg.exe -CommandType Application -ErrorAction Stop).Source
          $ffprobePath = (Get-Command ffprobe.exe -CommandType Application -ErrorAction Stop).Source

          Write-Host "FFmpeg path: $ffmpegPath"
          Write-Host "FFprobe path: $ffprobePath"

          & $ffmpegPath -version
          if ($LASTEXITCODE -ne 0) {
            throw "FFmpeg version check failed"
          }

          & $ffprobePath -version
          if ($LASTEXITCODE -ne 0) {
            throw "FFprobe version check failed"
          }

          npm run check:native:all -- "$ffmpegPath" "$ffprobePath"
          if ($LASTEXITCODE -ne 0) {
            throw "Native acceptance checks failed"
          }

      - name: Verify native processing on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ffmpegPrefix="$(brew --prefix ffmpeg)"
          ffmpegPath="$ffmpegPrefix/bin/ffmpeg"
          ffprobePath="$ffmpegPrefix/bin/ffprobe"

          echo "FFmpeg path: $ffmpegPath"
          echo "FFprobe path: $ffprobePath"

          "$ffmpegPath" -version
          "$ffprobePath" -version

          npm run check:native:all -- "$ffmpegPath" "$ffprobePath"
