name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["22", "24"]

    env:
      MAVIO_BROWSER_CHANNEL: ""
      PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "120000"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser
        run: npx playwright install --with-deps chromium --only-shell

      - name: Verify SDK
        run: npm run check

  native:
    name: Native Ubuntu 24.04 / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install native tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Record native tool versions
        run: |
          /usr/bin/ffmpeg -version
          /usr/bin/ffprobe -version

      - name: Verify native media processing
        run: npm run check:native:all -- /usr/bin/ffmpeg /usr/bin/ffprobe
