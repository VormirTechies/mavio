name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["22", "24"]

    env:
      MAVIO_BROWSER_CHANNEL: ""
      PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "120000"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser
        run: npx playwright install --with-deps chromium --only-shell

      - name: Verify SDK
        run: npm run check

  native:
    name: Native Ubuntu 24.04 / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install native tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Record native tool versions
        run: |
          /usr/bin/ffmpeg -version
          /usr/bin/ffprobe -version

      - name: Verify native media processing
        run: npm run check:native:all -- /usr/bin/ffmpeg /usr/bin/ffprobe

  browser:
    needs: candidate-kit-access
    if: always() && (github.event_name == 'pull_request' || needs.candidate-kit-access.result == 'success')
    name: Browser ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
        node: ["22", "24"]

    env:
      MAVIO_BROWSER_CHANNEL: ""
      PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "120000"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium --only-shell

      - name: Download verified v2 archive
        if: github.event_name != 'pull_request'
        uses: actions/download-artifact@v8
        with:
          name: candidate-v2-engine-kit
          path: ${{ runner.temp }}/candidate-kit-download

      - name: Verify and select v2 kit
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          KIT_ARCHIVE: ${{ runner.temp }}/candidate-kit-download/engine-kit.tar.gz
          KIT_DEST: ${{ runner.temp }}/mavio-v2-engine-kit
        run: node scripts/prepare-ci-engine-kit.mjs "$KIT_ARCHIVE" "$KIT_DEST"

      - name: Verify installed-package browser routes
        env:
          MAVIO_PACKAGE_BROWSER: "1"
        run: npm run test:package

  native-platforms:
    name: Native ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
        node: ["22", "24"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install native tools on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ffmpeg --yes --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw "FFmpeg installation failed with exit code $LASTEXITCODE"
          }

      - name: Install native tools on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: brew install ffmpeg

      - name: Verify native processing on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ffmpegPath = (Get-Command ffmpeg.exe -CommandType Application -ErrorAction Stop).Source
          $ffprobePath = (Get-Command ffprobe.exe -CommandType Application -ErrorAction Stop).Source

          Write-Host "FFmpeg path: $ffmpegPath"
          Write-Host "FFprobe path: $ffprobePath"

          & $ffmpegPath -version
          if ($LASTEXITCODE -ne 0) {
            throw "FFmpeg version check failed"
          }

          & $ffprobePath -version
          if ($LASTEXITCODE -ne 0) {
            throw "FFprobe version check failed"
          }

          npm run check:native:all -- "$ffmpegPath" "$ffprobePath"
          if ($LASTEXITCODE -ne 0) {
            throw "Native acceptance checks failed"
          }

      - name: Verify native processing on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ffmpegPrefix="$(brew --prefix ffmpeg)"
          ffmpegPath="$ffmpegPrefix/bin/ffmpeg"
          ffprobePath="$ffmpegPrefix/bin/ffprobe"

          echo "FFmpeg path: $ffmpegPath"
          echo "FFprobe path: $ffprobePath"

          "$ffmpegPath" -version
          "$ffprobePath" -version

          npm run check:native:all -- "$ffmpegPath" "$ffprobePath"

  m6:
    name: M6 examples and resources / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]

    env:
      MAVIO_BROWSER_CHANNEL: ""
      PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "120000"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install native tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Install Chromium
        run: npx playwright install --with-deps chromium --only-shell

      - name: Verify M6 examples and bounded resources
        run: npm run check:m6 -- /usr/bin/ffmpeg /usr/bin/ffprobe

  candidate-kit-access:
    name: Candidate v2 draft artifact access
    if: github.repository == 'VormirTechies/mavio' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Draft visibility requires push-level access; confined to this probe.
    # The commands below only inspect and download the draft asset.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Verify draft access and artifact hash
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          gh release view m7-core-v2-review --repo VormirTechies/mavio --json isDraft,assets > draft.json
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import {readFile} from "node:fs/promises";
            const release = JSON.parse(await readFile("draft.json", "utf8"));
            assert.equal(release.isDraft, true);
            const asset = release.assets.find(item => item.name === "mavio-candidate-v2-engine-kit.tar.gz");
            assert.ok(asset);
            assert.equal(asset.size, 51321159);
          '
          gh api -H 'Accept: application/octet-stream' repos/VormirTechies/mavio/releases/assets/675701697 > engine-kit.tar.gz
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import {createHash} from "node:crypto";
            import {readFile} from "node:fs/promises";
            const bytes = await readFile("engine-kit.tar.gz");
            assert.equal(bytes.length, 51321159);
            assert.equal(createHash("sha256").update(bytes).digest("hex"),
              "d3716527590fa75336f7e1234bb097fd1b87523b17996c052981f1dd862cb838");
            console.log("PASS: Read-only CI token downloaded the exact draft kit.");
          '

      - name: Share verified archive with Browser jobs
        uses: actions/upload-artifact@v7
        with:
          name: candidate-v2-engine-kit
          path: ${{ runner.temp }}/engine-kit.tar.gz
          if-no-files-found: error
          retention-days: 7
