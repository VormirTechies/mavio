<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Mavio browser example</title>
  </head>
  <body>
    <main>
      <h1>Mavio browser example</h1>
      <p>Convert supported video to MP4, fitting within 640 by 360 without upscaling.</p>
      <p>Processing stays in this browser. Select media matching the documented source profile.</p>
      <label for="media">Video file</label>
      <input id="media" type="file" accept="video/*" />
      <button id="run" type="button">Create MP4</button>
      <button id="cancel" type="button" disabled>Cancel</button>
      <pre id="status" role="status" aria-live="polite">Choose a video.</pre>
      <a id="download" download="mavio-output.mp4" hidden>Download MP4</a>
      <video id="preview" controls aria-label="Converted video preview"></video>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
